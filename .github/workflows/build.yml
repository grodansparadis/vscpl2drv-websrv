name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libexpat1-dev \
            libcurl4-openssl-dev zlib1g-dev pandoc

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/

      - name: Build
        run: cmake --build build --parallel

      - name: Check that the driver loads
        run: |
          cc ci/check-driver.c -o build/check-driver -ldl
          build/check-driver "$(ls build/libvscpl2drv-websrv.so* | head -1)"

      - name: Package
        working-directory: build
        run: |
          cpack -G DEB
          ls -l *.deb

      - name: Write SHA256SUMS
        id: sha256sums
        continue-on-error: true
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE//\\//}/.github/scripts/write-sha256sums.sh" "SHA256SUMS-vscpl2drv-websrv-${{ matrix.os }}" <<'SHA256SUMS_PATTERNS'
          build/*.deb
          SHA256SUMS_PATTERNS

      - uses: actions/upload-artifact@v7
        with:
          name: vscpl2drv-websrv-${{ matrix.os }}
          path: |
            build/*.deb
            ${{ steps.sha256sums.outputs.file }}
          if-no-files-found: error
